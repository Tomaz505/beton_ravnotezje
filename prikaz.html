<body>

<h2>Analiza betonskega prereza</h2>
Za izbrane podatke imamo naslednje deformacijske ravnine.

<div id="chart" style="width:400px;height:400px;"></div>

<script>
// Parse first dataset
const lines = sec_coor.trim().split(/\r?\n/);
const xData = [];
const yData = [];

lines.forEach(line => {
    const parts = line.trim().split(/\s+/);
    if (parts.length === 2) {
        xData.push(parseFloat(parts[0]));
        yData.push(parseFloat(parts[1]));
    }
});
console.log(xData)

// Plotly traces
const trace1 = {
    x: xData,
    y: yData,
    mode: 'lines',
    name: 'ε_c',
    line: { width: 2, color: 'blue' }
};

// Layout
const layout = {
    xaxis: { title: 'y',scaleratio: 1 },
    yaxis: { title: 'z',autorange:'reversed',scaleratio: 1 },
    margin: { t: 20 }
};

// Render
Plotly.newPlot('chart', [trace1], layout);
</script>

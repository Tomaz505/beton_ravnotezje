<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Analiza betonskega prereza</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="mapa/out.js"></script>
</head>
<body>

<h2>Analiza betonskega prereza</h2>
<body>Za izbrane podatke imamo naslednje deformacijske ravnine.</body>

<canvas id="chart" width="600" height="200"></canvas>

<script>
const lines = fortranData.trim().split(/\r?\n/);

const xData = [];
const yData = [];



lines.forEach(line => {
    const parts = line.trim().split(/\s+/);
    if (parts.length === 2) {
        xData.push(parseFloat(parts[1]));
        yData.push(parseFloat(parts[0]));
    }
});



const ctx = document.getElementById('chart').getContext('2d');
new Chart(ctx, {
    type: 'line',
    data: {
        labels: xData,
        datasets: [{
            label: 'ε_cs',
            data: yData,
            borderWidth: 2
        }]
    },
    options: {
        responsive: true,
        scales: {
            x: { title: { display: true, text: 'X Value' }},
            y: { title: { display: true, text: 'Y Value' }}
        }
    }
});
</script>

</body>
</html>

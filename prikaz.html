<script>
// Parse first dataset
const lines = sec_coor.trim().split(/\r?\n/);
const xData = [];
const yData = [];
lines.forEach(line => {
    const parts = line.trim().split(/\s+/);
    if (parts.length === 2) {
        xData.push(parseFloat(parts[0]));
        yData.push(parseFloat(parts[1]));
    }
});

const lines_a = a_coor.trim().split(/\r?\n/);
const xData_a = [];
const yData_a = [];
const aData_a = [];
const aData_af = [];
lines_a.forEach(line => {
    const parts = line.trim().split(/\s+/);
    if (parts.length === 3) {
        xData_a.push(parseFloat(parts[0]));
        yData_a.push(parseFloat(parts[1]));
        aData_a.push(parseFloat(parts[2].slice(0,5)))
        aData_af.push(6*parseFloat(parts[2].slice(0,5)));
    }
});




const lines_epsc = eps_c.trim().split(/\r?\n/);
const xData_c = [];
const yData_c = [];
lines_epsc.forEach(line => {
    const parts = line.trim().split(/\s+/);
    if (parts.length === 2) {
        xData_c.push(parseFloat(parts[0]));
        yData_c.push(parseFloat(parts[1]));
    }
});




const lines_epss = eps_s.trim().split(/\r?\n/);
const xData_s = [];
const yData_s = [];

lines_epss.forEach(line => {
    const parts = line.trim().split(/\s+/);
    if (parts.length === 2) {
        xData_s.push(parseFloat(parts[0]));
        yData_s.push(parseFloat(parts[1]));
    }
});

const lines_sigc = sig_c.trim().split(/\r?\n/);
const xData_cs = [];
const yData_cs = [];
lines_sigc.forEach(line => {
    const parts = line.trim().split(/\s+/);
    if (parts.length === 2) {
        xData_cs.push(parseFloat(parts[0]));
        yData_cs.push(parseFloat(parts[1]));
    }
});




const lines_sigs = sig_s.trim().split(/\r?\n/);
const xData_ss = [];
const yData_ss = [];

lines_sigs.forEach(line => {
    const parts = line.trim().split(/\s+/);
    if (parts.length === 2) {
        xData_ss.push(parseFloat(parts[0]));
        yData_ss.push(parseFloat(parts[1]));
    }
});


// Plotly traces
var trace1 = {
    x: xData,
    y: yData,
    mode: 'lines',
    name: 'Prerez',
    line: { width: 2, color: 'blue' },
    showlegend:false
};

var trace2 = {
    x: xData_a,
    y: yData_a,
    mode: 'markers',
    type: 'scatter',
    name: 'd',
    text: aData_a,
    marker: { size: aData_af ,color:'orange',  opacity: 0.5},
    showlegend:false

};

var trace3 = {
    x: xData_c,
    y: yData_c,
    xaxis: 'x2',
    yaxis: 'y2',
    name: 'ε_c',
    mode: 'lines',
    line: { width: 2, color: '#00ff7f' }

};

var trace4 = {

    x: xData_s,
    y: yData_s,

    xaxis:'x2',
    yaxis: 'y2',
    name: 'ε_s',
    mode: 'markers',
    type: 'scatter',
    marker: { size: 14 ,color:'red',opacity: 1, symbol: 'circle-open-dot'},

};

var trace5 = {
    x: xData_cs,
    y: yData_cs,
    xaxis: 'x3',
    yaxis: 'y3',
    name: 'σ_c',
    mode: 'lines',
    line: { width: 2, color: '#872657' }

};

var trace6 = {

    x: xData_ss,
    y: yData_ss,

    xaxis:'x3',
    yaxis: 'y3',
    name: 'σ_s',
    mode: 'markers',
    type: 'scatter',
    marker: { size: 14 ,color:'#FDBD01',opacity: 1, symbol: 'circle-open-dot'},

};

// Layout
var layout = {
    xaxis: { title: 'y',scaleratio: 1, tickmode: 'array', tickvals: xData.concat(xData_a),tickangle: -90 },
    yaxis: {range: [Math.min(...yData),Math.max(...yData)], title: 'z',scaleratio: 1, tickmode: 'array', tickvals: yData.concat(yData_a) },

    xaxis2: {tickangle: -90,tickformat: ".3e"},
    yaxis2: {range: [Math.min(...yData),Math.max(...yData)],  tickmode: 'array', tickvals: yData.concat(yData_a)  },

    xaxis3: {tickangle: -90},
    yaxis3: {range: [Math.min(...yData),Math.max(...yData)],  tickmode: 'array', tickvals: yData.concat(yData_a)  },

    margin: { t: 20 },
    grid: {rows:1,columns:3, pattern: 'independent'}
};

// Render
Plotly.newPlot('chart', [trace1,trace2,trace3,trace4,trace5,trace6], layout);
</script>

<body>

<h2>Analiza betonskega prereza</h2>
Za izbrane podatke imamo naslednje deformacijske ravnine.

<div id="chart" style="width:600px;height:300px;"></div>

<script>
// Parse first dataset
const lines = fortranData.trim().split(/\r?\n/);
const xData = [];
const yData = [];

lines.forEach(line => {
    const parts = line.trim().split(/\s+/);
    if (parts.length === 2) {
        xData.push(parseFloat(parts[1]));
        yData.push(parseFloat(parts[0]));
    }
});

// Parse second dataset
const lines1 = fortranData1.trim().split(/\r?\n/);
const xData1 = [];
const yData1 = [];

lines1.forEach(line => {
    const parts = line.trim().split(/\s+/);
    if (parts.length === 2) {
        xData1.push(parseFloat(parts[1]));
        yData1.push(parseFloat(parts[0]));
    }
});

// Plotly traces
const trace1 = {
    x: xData,
    y: yData,
    mode: 'lines',
    name: 'ε_c',
    line: { width: 2, color: 'blue' }
};

const trace2 = {
    x: xData1,
    y: yData1,
    mode: 'lines',
    name: 'ε_s',
    line: { width: 2, color: 'red' }
};

// Layout
const layout = {
    xaxis: { title: 'ε' },
    yaxis: { title: 'z',autorange:'reversed' },
    margin: { t: 20 }
};

// Render
Plotly.newPlot('chart', [trace1, trace2], layout);
</script>

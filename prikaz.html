<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
     <!--   <meta http-equiv="refresh" content="10">  -->
    <title>Analiza betonskega prereza</title>
    <script src="https://cdn.plot.ly/plotly-3.3.1.js"></script>
    <script src="mapa/out.js"></script>
</head>
<body>

<h2>Analiza betonskega prereza</h2>
Diagram prereza.


<div id="chart" style="width:800px;height:400px;"></div>



<script>
// Parse first dataset
const lines = sec_coor.trim().split(/\r?\n/);
const xData = [];
const yData = [];
lines.forEach(line => {
    const parts = line.trim().split(/\s+/);
    if (parts.length === 2) {
        xData.push(parseFloat(parts[0]));
        yData.push(parseFloat(parts[1]));
    }
});

const lines_a = a_coor.trim().split(/\r?\n/);
const xData_a = [];
const yData_a = [];
const aData_a = [];
lines_a.forEach(line => {
    const parts = line.trim().split(/\s+/);
    if (parts.length === 3) {
        xData_a.push(parseFloat(parts[0]));
        yData_a.push(parseFloat(parts[1]));
        aData_a.push(parts[2].slice(0,5));
    }
});

console.log(xData_a)
console.log(yData_a)
console.log(aData_a)



const lines_epsc = eps_c.trim().split(/\r?\n/);
const xData_c = [];
const yData_c = [];
lines_epsc.forEach(line => {
    const parts = line.trim().split(/\s+/);
    if (parts.length === 2) {
        xData_c.push(parseFloat(parts[0]));
        yData_c.push(parseFloat(parts[1]));
    }
});




const lines_epss = eps_s.trim().split(/\r?\n/);
const xData_s = [];
const yData_s = [];

lines_epss.forEach(line => {
    const parts = line.trim().split(/\s+/);
    if (parts.length === 2) {
        xData_s.push(parseFloat(parts[0]));
        yData_s.push(parseFloat(parts[1]));
    }
});


// Plotly traces
var trace1 = {
    x: xData,
    y: yData,
    mode: 'lines',
    name: 'Prerez',
    line: { width: 1, color: 'blue' },
    showlegend:false
};

var trace2 = {
    x: xData_a,
    y: yData_a,
    mode: 'markers',
    type: 'scatter',
    name: 'R',
    text: aData_a,
    marker: { size: 12,color:'gray' },
    showlegend:false
};

var trace3 = {
    x: xData_c,
    y: yData_c,
    xaxis: 'x2',
    yaxis: 'y2',
    name: 'ε_c',
    mode: 'lines',
    line: { width: 2, color: 'red' }

};

var trace4 = {

    x: xData_s,
    y: yData_s,

    xaxis:'x2',
    yaxis: 'y2',
    name: 'ε_s',
    mode: 'lines',
    line: { width: 2, color: 'green' }

};

// Layout
var layout = {
    xaxis: { title: 'y',scaleratio: 1 },
    yaxis: { title: 'z',scaleratio: 1 },
    margin: { t: 10 },
    grid: {rows:1,columns:2, pattern: 'independent'}
};

// Render
Plotly.newPlot('chart', [trace1,trace2,trace3,trace4], layout);
</script>



</body>
</html>
